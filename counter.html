
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Signal Theatre Counter</title>
<style>
body {
  margin: 0;
  background: #10121b;
  color: #e0ba7c;
  font-family: Arial, sans-serif;
  text-align: center;
}
.counter {
  border: 2px solid #b89150;
  border-radius: 12px;
  padding: 20px 10px;
}
h2 {
  font-size: 17px;
  letter-spacing: 2px;
}
#total {
  color: white;
  font-size: 44px;
  font-weight: bold;
  margin: 12px 0;
}
</style>
</head>
<body>

<div class="counter">
  <h2>MIDNIGHT SIGNAL THEATRE</h2>
  <div id="total">Loading...</div>
  <div>TOTAL THEATRE VISITS</div>
</div>

<script>
const params = new URLSearchParams(location.search);

if (params.get("owner") === "1") {
  localStorage.setItem("theatreOwner", "yes");
}

const owner =
  localStorage.getItem("theatreOwner") === "yes";

const base =
  "https://countapi.mileshilliard.com/api/v1";

const key = "midnight-signal-theatre-2026-visits";

const url = base + (owner ? "/get/" : "/hit/") + key;

fetch(url, {cache: "no-store"})
  .then(response => {
    if (!response.ok) throw new Error("API error");
    return response.json();
  })
  .then(data => {
    const count = Number(data.value);
    if (!Number.isFinite(count)) {
      throw new Error("Invalid count");
    }
    document.getElementById("total").textContent =
      count.toLocaleString();
  })
  .catch(() => {
    document.getElementById("total").textContent =
      "Unavailable";
  });
</script>

</body>
</html>
