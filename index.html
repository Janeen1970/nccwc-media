<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>NCCWC Media</title>

<style>
:root {
  --danger:#b91c1c;
}

body{
  margin:0;
  padding-top:260px;
  background:#020617;
  color:#f9fafb;
  font-family:Arial;
}

/* ===== ANIMATION ===== */
@keyframes ticker{
  from{transform:translateX(0);}
  to{transform:translateX(-100%);}
}

/* ===== BULLETIN ===== */
#live-bar{
  position:fixed;
  top:0;left:0;right:0;
  height:56px;
  background:var(--danger);
  display:flex;
  align-items:center;
  z-index:9999;
}
#live-bar-scroll{
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 120s linear infinite;
}

/* ===== WALT ===== */
#walt-ticker{
  position:fixed;
  top:56px;
  left:0;right:0;
  height:40px;
  background:black;
  color:#0f0;
  display:flex;
  align-items:center;
  z-index:9998;
}
#walt-ticker-label{
  padding:0 10px;
  font-weight:bold;
}
#walt-ticker-scroll{
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 300s linear infinite;
}

/* ===== GENERIC TICKER ===== */
.ticker{
  position:fixed;
  left:0;right:0;
  height:36px;
  display:flex;
  align-items:center;
  overflow:hidden;
  z-index:9997;
}
.ticker .label{
  padding:0 10px;
  min-width:90px;
  font-weight:bold;
}
.ticker .scroll{flex:1;}
.ticker .scroll div{
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 20s linear infinite;
}

/* STACK */
.watch{top:96px;background:#111;color:#facc15;}
.warning{top:132px;background:#3f0000;color:#ff4d4d;}
.report{top:168px;background:#001f3f;color:#66ccff;}
.radar{top:204px;background:#111827;color:#c084fc;}

/* ===== RADIO ===== */
.wrap{max-width:1100px;margin:auto;padding:20px;}
.grid{display:flex;gap:16px;}
section.card{width:65%;}
aside.card{width:35%;}

.track{
  padding:6px;
  border-bottom:1px solid #222;
  cursor:pointer;
}
.track.badge-playing{
  background:#222;
}
</style>
</head>

<body>

<!-- BULLETIN -->
<div id="live-bar">
  <div id="live-bar-scroll">
    <span id="live-bar-text">Loading bulletin...</span>
  </div>
</div>

<!-- WALT -->
<div id="walt-ticker">
  <div id="walt-ticker-label">WALT</div>
  <div id="walt-ticker-scroll">Loading WALT...</div>
</div>

<!-- WATCH -->
<div class="ticker watch">
  <div class="label">WATCH</div>
  <div class="scroll"><div id="watch-text">Loading watches...</div></div>
</div>

<!-- WARNING -->
<div class="ticker warning">
  <div class="label">WARNING</div>
  <div class="scroll"><div id="warning-text">Loading warnings...</div></div>
</div>

<!-- REPORT -->
<div class="ticker report">
  <div class="label">REPORTS</div>
  <div class="scroll"><div id="report-text">Loading reports...</div></div>
</div>

<!-- RADAR -->
<div class="ticker radar">
  <div class="label">RADAR</div>
  <div class="scroll"><div id="radar-text">Loading radar...</div></div>
</div>

<div class="wrap">
<div class="grid">

<section class="card">
<h2>Now Playing</h2>
<h3 id="now-title">—</h3>

<audio id="audio" controls></audio>

<div>
<button id="btn-prev">Prev</button>
<button id="btn-play">Play</button>
<button id="btn-next">Next</button>
</div>

<div id="status"></div>
</section>

<aside class="card">
<h2>Playlist</h2>
<ul id="playlist"></ul>
</aside>

</div>
</div>

<script>

/* ===== BULLETIN ===== */
function loadTicker(file,id,fallback){
  const el=document.getElementById(id);
  fetch(file+"?_="+Date.now())
    .then(r=>r.text())
    .then(t=>el.textContent=t.trim()||fallback)
    .catch(()=>el.textContent=fallback);
}

function loadAllTickers(){
  loadTicker("bulletin.txt","live-bar-text","No bulletin.");
  loadTicker("walt.txt","walt-ticker-scroll","No WALT.");
  loadTicker("watch.txt","watch-text","No watches.");
  loadTicker("warning.txt","warning-text","No warnings.");
  loadTicker("reports.txt","report-text","No reports.");
  loadTicker("radar.txt","radar-text","Radar quiet.");
}

loadAllTickers();
setInterval(loadAllTickers,20000);

/* ===== RADIO ===== */
const GH_OWNER="Janeen1970";
const GH_REPO="nccwc-media";
const API_URL=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/`;

const audio=document.getElementById("audio");
const playlist=document.getElementById("playlist");
const now=document.getElementById("now-title");

let tracks=[];
let index=0;

function loadTrack(i){
  index=(i+tracks.length)%tracks.length;
  audio.src=tracks[index].url;
  now.textContent=tracks[index].title;
}

function next(){loadTrack(index+1);}
function prev(){loadTrack(index-1);}

document.getElementById("btn-next").onclick=next;
document.getElementById("btn-prev").onclick=prev;

document.getElementById("btn-play").onclick=()=>{
  if(audio.paused){audio.play();}
  else{audio.pause();}
};

async function loadTracks(){
  const res=await fetch(API_URL);
  const data=await res.json();

  tracks=data
    .filter(x=>x.name.endsWith(".mp3"))
    .map(x=>({
      title:x.name.replace(".mp3",""),
      url:x.download_url
    }));

  playlist.innerHTML="";
  tracks.forEach((t,i)=>{
    const li=document.createElement("li");
    li.className="track";
    li.textContent=t.title;
    li.onclick=()=>loadTrack(i);
    playlist.appendChild(li);
  });

  loadTrack(0);
}

loadTracks();

</script>

</body>
</html>
