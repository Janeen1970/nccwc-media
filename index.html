<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>NCCWC Media — NCCWC Radio, Weather Tools & WALT Model Forecasting</title>

  <meta name="description" content="NCCWC Media features NCCWC Radio, original music, radar tools, severe storm videos, tornado forecasting, and the WALT Model for Eastern Oklahoma and Western Arkansas.">
  <meta name="keywords" content="NCCWC Media, NCCWC Radio, WALT Model, tornado forecast, Oklahoma weather, Arkansas storms, severe weather audio, Wayne Adams, GitHub radio, storm videos, music playlist">

  <meta name="author" content="Wayne Adams">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://janeen1970.github.io/nccwc-media/">

  <style>
    :root {
      --bg: #020617;
      --card: #0b1120;
      --muted: #9ca3af;
      --text: #f9fafb;
      --accent: #38bdf8;
      --line: #1f2937;
      --danger: #b91c1c;
    }

    body {
      margin: 0;
      padding-top: 56px;
      background: radial-gradient(1200px 800px at 20% -10%, #111827 0, #020617 55%, #000 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Ubuntu, Arial;
      color: var(--text);
    }

    /* ===== BULLETIN BAR ===== */
    #live-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--danger);
      color: #fee2e2;
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 9999;
    }
    #live-bar-scroll {
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: ticker 150s linear infinite;
    }
    #live-bar-text {
      font-size: 18px;
      font-weight: 700;
      padding: 0 12px;
    }

    @keyframes ticker {
      from { transform: translateX(0); }
      to   { transform: translateX(-100%); }
    }

    /* ===== WALT TICKER ===== */
    #walt-ticker {
      width: 100%;
      background: #000;
      color: #0f0;
      display: flex;
      align-items: center;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }
    #walt-ticker-label {
      padding: 4px 12px;
      background: #111;
      border-right: 1px solid #333;
      font-weight: bold;
    }
    #walt-ticker-window {
      flex: 1;
      overflow: hidden;
    }
    #walt-ticker-scroll {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: waltTicker 30s linear infinite;
    }
    @keyframes waltTicker {
      from { transform: translateX(0); }
      to   { transform: translateX(-100%); }
    }

    /* ========== NWS TICKERS ========== */

    /* Nationwide */
    #group-ticker {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      color: #ff4444;
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      padding: 6px 0;
      z-index: 99999;
    }
    #group-scroll {
      display: inline-block;
      padding-left: 300%;
      animation: gscroll 2400s linear infinite;
    }
    @keyframes gscroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-100%); }
    }

    /* Four-office */
    #fouroffice-ticker {
      position: fixed;
      bottom: 32px;
      width: 100%;
      background: #111;
      color: #ffeb3b;
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      padding: 5px 0;
      z-index: 100000;
    }
    #fouroffice-scroll {
      display: inline-block;
      padding-left: 300%;
      animation: fourScroll 100s linear infinite;
    }
    @keyframes fourScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-100%); }
    }

    /* ===== RADIO LAYOUT ===== */
    .wrap {
      max-width: 1100px;
      margin: 80px auto;
      padding: 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.3fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #020617;
      border-radius: 18px;
      border: 1px solid var(--line);
      padding: 16px;
    }

    .playlist {
      max-height: 460px;
      overflow-y: auto;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #0f172a;
    }
    .track:last-child { border-bottom: none; }

    .track.badge-playing {
      background: rgba(56,189,248,0.12);
      border-left: 2px solid var(--accent);
    }
  </style>
</head>

<body>

<!-- BULLETIN BAR -->
<div id="live-bar">
  <div id="live-bar-scroll"><span id="live-bar-text">Loading NCCWC bulletin…</span></div>
</div>

<!-- WALT TICKER (directly under bulletin bar) -->
<div id="walt-ticker">
  <div id="walt-ticker-label">WALT</div>
  <div id="walt-ticker-window">
    <div id="walt-ticker-scroll">Loading WALT Model…</div>
  </div>
</div>

<!-- Four-office ticker -->
<div id="fouroffice-ticker">
  <div id="fouroffice-scroll">Loading Oklahoma–Arkansas office warnings…</div>
</div>

<!-- Nationwide ticker -->
<div id="group-ticker">
  <div id="group-scroll">Loading NWS nationwide alerts…</div>
</div>

<div class="wrap">

  <!-- RADIO -->
  <div class="grid">
    <section class="card">
      <h2>Now Playing</h2>
      <small id="track-count-label">Loading playlist…</small>
      <h3 id="now-title">—</h3>
      <div id="now-sub">NCCWC Media • Auto playlist</div>

      <audio id="audio" controls preload="none"></audio>

      <div>
        <button id="btn-prev">Prev</button>
        <button id="btn-play">▶️ Play</button>
        <button id="btn-next">Next</button>
      </div>

      <div id="status"></div>
    </section>

    <!-- Playlist -->
    <aside class="card">
      <h2>Playlist</h2>
      <ul id="playlist"></ul>
      <p>All MP3 files in repo root load automatically.</p>
    </aside>
  </div>
</div>

<script>
/* ===== BULLETIN TXT ===== */
async function loadLiveBulletin() {
  const el = document.getElementById("live-bar-text");
  try {
    const res = await fetch("bulletin.txt?_=" + Date.now());
    const txt = (await res.text()).trim();
    el.textContent = txt || "NCCWC: No active bulletin.";
  } catch {
    el.textContent = "NCCWC: Error loading bulletin.";
  }
}
loadLiveBulletin();
setInterval(loadLiveBulletin, 20000);

/* ===== WALT TXT ===== */
async function loadWaltTicker() {
  const el = document.getElementById("walt-ticker-scroll");
  try {
    const res = await fetch("walt.txt?_=" + Date.now());
    const txt = (await res.text()).trim();
    el.textContent = txt || "WALT Model: No active alert.";
  } catch {
    el.textContent = "WALT Model: Error loading.";
  }
}
loadWaltTicker();
setInterval(loadWaltTicker, 20000);

/* ===== Nationwide NWS Alerts ===== */
async function loadGroupedNWS() {
  try {
    const res = await fetch("https://api.weather.gov/alerts/active");
    const data = await res.json();

    if (!data.features.length) {
      document.getElementById("group-scroll").textContent =
        "No active NWS alerts nationwide.";
      return;
    }

    const out = data.features.slice(0,20)
                 .map(f => f.properties.event)
                 .join(" • ");

    document.getElementById("group-scroll").textContent = out;
  } catch {
    document.getElementById("group-scroll").textContent =
      "Error loading NWS alerts.";
  }
}
loadGroupedNWS();
setInterval(loadGroupedNWS, 60000);

/* ===== Regional 4-Office Alerts ===== */
async function loadFourOfficeNWS() {
  try {
    const res = await fetch("https://api.weather.gov/alerts/active");
    const data = await res.json();

    const TARGET = [
      "NWS Tulsa OK",
      "NWS Norman OK",
      "NWS Little Rock AR",
      "NWS Shreveport LA"
    ];

    const alerts = data.features.filter(
      f => TARGET.includes(f.properties.senderName)
    );

    if (!alerts.length) {
      document.getElementById("fouroffice-scroll").textContent =
        "No severe weather in Tulsa, Norman, Little Rock, or Shreveport.";
      return;
    }

    const out = alerts
      .map(f => f.properties.senderName + ": " + f.properties.event)
      .join("  |  ");

    document.getElementById("fouroffice-scroll").textContent = out;

  } catch {
    document.getElementById("fouroffice-scroll").textContent =
      "Error loading regional warnings.";
  }
}
loadFourOfficeNWS();
setInterval(loadFourOfficeNWS, 60000);

/* ===== RADIO PLAYER — ORIGINAL (NO DUPLICATES) ===== */

const GH_OWNER = "Janeen1970";
const GH_REPO  = "nccwc-media";
const API_URL  = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/`;

const audioEl = document.getElementById("audio");
const playlistEl = document.getElementById("playlist");
const nowTitleEl = document.getElementById("now-title");
const nowSubEl = document.getElementById("now-sub");
const statusEl = document.getElementById("status");
const trackCountEl = document.getElementById("track-count-label");

let tracks = [];
let currentIndex = 0;

function niceTitle(name) {
  return decodeURIComponent(
    name.replace(/\.mp3$/i, "").replace(/[_]+/g, " ")
  ).trim();
}

function renderPlaylist() {
  playlistEl.innerHTML = "";
  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.className = "track";
    if (i === currentIndex) li.classList.add("badge-playing");

    li.innerHTML = `
      <div>${i + 1}.</div>
      <div class="track-main">${t.title}</div>
    `;

    li.addEventListener("click", () => loadTrack(i, true));
    playlistEl.appendChild(li);
  });
}

function updatePlaylistHighlight() {
  Array.from(playlistEl.children).forEach((li, idx) => {
    li.classList.toggle("badge-playing", idx === currentIndex);
  });
}

function loadTrack(index, autoplay=false) {
  currentIndex = (index + tracks.length) % tracks.length;
  const t = tracks[currentIndex];

  audioEl.src = t.url;
  nowTitleEl.textContent = t.title;
  nowSubEl.textContent = "NCCWC Media • GitHub Stream";
  updatePlaylistHighlight();

  if (autoplay) {
    audioEl.play().catch(() => {
      statusEl.textContent = "Tap ▶️ Play to allow audio.";
    });
  }
}

function nextTrack() {
  loadTrack(currentIndex + 1, true);
}
function prevTrack() {
  loadTrack(currentIndex - 1, true);
}

document.getElementById("btn-next").addEventListener("click", nextTrack);
document.getElementById("btn-prev").addEventListener("click", prevTrack);

document.getElementById("btn-play").addEventListener("click", () => {
  if (audioEl.paused) {
    audioEl.play();
    document.getElementById("btn-play").textContent = "⏸ Pause";
  } else {
    audioEl.pause();
    document.getElementById("btn-play").textContent = "▶️ Play";
  }
});

audioEl.addEventListener("ended", nextTrack);

async function loadTracks() {
  statusEl.textContent = "Loading…";

  const res = await fetch(API_URL);
  const data = await res.json();

  const mp3s = data.filter(x => x.name.toLowerCase().endsWith(".mp3"));

  tracks = mp3s.map(x => ({
    name: x.name,
    title: niceTitle(x.name),
    url: x.download_url
  })).sort((a,b)=>a.name.localeCompare(b.name));

  trackCountEl.textContent = `${tracks.length} tracks loaded`;

  renderPlaylist();
  loadTrack(0);
  statusEl.textContent = "";
}
loadTracks();
</script>

</body>
</html>
