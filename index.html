<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>NCCWC Media</title>

<style>
body{
  margin:0;
  padding-top:260px;
  background:#020617;
  color:white;
  font-family:Arial;
}

/* ===== MAIN TICKER ANIMATION ===== */
@keyframes ticker{
  from{transform:translateX(0);}
  to{transform:translateX(-100%);}
}

/* ===== BULLETIN ===== */
#live-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:56px;
  background:#b91c1c;
  display:flex;
  align-items:center;
  z-index:9999;
}
#live-bar-scroll{
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 120s linear infinite;
}

/* ===== WALT ===== */
#walt-ticker{
  position:fixed;
  top:56px;
  left:0;
  right:0;
  height:40px;
  background:black;
  color:#00ff00;
  display:flex;
  align-items:center;
  z-index:9998;
}
#walt-ticker-label{
  padding:0 10px;
  font-weight:bold;
}
#walt-ticker-scroll{
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 300s linear infinite;
}

/* ===== GENERIC TICKER ===== */
.ticker{
  position:fixed;
  left:0;
  right:0;
  height:36px;
  display:flex;
  align-items:center;
  overflow:hidden;
  z-index:9997;
}
.ticker .label{
  padding:0 10px;
  font-weight:bold;
  min-width:90px;
}
.ticker .scroll{
  flex:1;
}
.ticker .scroll div{
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 120s linear infinite;
}

/* ===== STACK POSITIONS ===== */
.watch   {top:96px;background:#111;color:#facc15;}
.warning {top:132px;background:#3f0000;color:#ff4d4d;}
.report  {top:168px;background:#001f3f;color:#66ccff;}
.radar   {top:204px;background:#111827;color:#c084fc;}
</style>
</head>

<body>

<!-- BULLETIN -->
<div id="live-bar">
  <div id="live-bar-scroll">
    <span id="live-bar-text">Loading bulletin...</span>
  </div>
</div>

<!-- WALT -->
<div id="walt-ticker">
  <div id="walt-ticker-label">WALT</div>
  <div id="walt-ticker-scroll">Loading WALT...</div>
</div>

<!-- WATCH -->
<div class="ticker watch">
  <div class="label">WATCH</div>
  <div class="scroll"><div id="watch-text">Loading watches...</div></div>
</div>

<!-- WARNING -->
<div class="ticker warning">
  <div class="label">WARNING</div>
  <div class="scroll"><div id="warning-text">Loading warnings...</div></div>
</div>

<!-- REPORT -->
<div class="ticker report">
  <div class="label">REPORTS</div>
  <div class="scroll"><div id="report-text">Loading reports...</div></div>
</div>

<!-- RADAR -->
<div class="ticker radar">
  <div class="label">RADAR</div>
  <div class="scroll"><div id="radar-text">Loading radar...</div></div>
</div>

<script>
function loadTicker(file,id,fallback){
  const el=document.getElementById(id);
  fetch(file+"?_="+Date.now())
    .then(r=>r.text())
    .then(t=>el.textContent=t.trim()||fallback)
    .catch(()=>el.textContent=fallback);
}

function loadAll(){
  loadTicker("bulletin.txt","live-bar-text","No bulletin.");
  loadTicker("walt.txt","walt-ticker-scroll","No WALT alert.");
  loadTicker("watch.txt","watch-text","No watches.");
  loadTicker("warning.txt","warning-text","No warnings.");
  loadTicker("reports.txt","report-text","No reports.");
  loadTicker("radar.txt","radar-text","Radar quiet.");
}

loadAll();
setInterval(loadAll,20000);
</script>

</body>
</html>
