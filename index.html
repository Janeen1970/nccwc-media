  <!-- ============================= -->
  <!-- CSS STYLES (INCLUDING WALT TICKER) -->

<style>
:root {
  --bg: #020617;
  --card: #0b1120;
  --card-soft: #020617;
  --muted: #9ca3af;
  --text: #f9fafb;
  --accent: #38bdf8;
  --line: #1f2937;
  --ok: #22c55e;
  --danger: #b91c1c;
}

body {
  margin: 0;
  padding-top: 56px;
  background: radial-gradient(1200px 800px at 20% -10%, #111827 0, #020617 55%, #000 100%);
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Ubuntu, Arial;
}

/* ===== SCROLLING Live Bulletin Bar ===== */
#live-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: var(--danger);
  color: #fee2e2;
  display: flex;
  align-items: center;
  overflow: hidden;
  z-index: 9999;
}
#live-bar-scroll {
  white-space: nowrap;
  display: inline-block;
  padding-left: 100%;
  animation: ticker 150s linear infinite;
}
@keyframes ticker {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* ===== WALT MODEL TICKER ===== */
#walt-ticker {
  width: 100%;
  background: #000;
  color: #0f0;
  font-size: 14px;
  font-family: system-ui, -apple-system, Segoe UI;
  display: flex;
  align-items: center;
  border-top: 1px solid #333;
  border-bottom: 1px solid #333;
}
#walt-ticker-label {
  padding: 4px 12px;
  background: #111;
  font-weight: bold;
  border-right: 1px solid #333;
}
#walt-ticker-window {
  overflow: hidden;
  flex: 1;
}
#walt-ticker-scroll {
  white-space: nowrap;
  display: inline-block;
  padding-left: 100%;
  animation: waltTicker 30s linear infinite; 
}
@keyframes waltTicker {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
#walt-ticker:hover #walt-ticker-scroll {
  animation-play-state: paused;
}

/* ===== Group Ticker (Bottom) ===== */
#group-ticker {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #000;
  color: #ff4444;
  font-size: 20px;
  white-space: nowrap;
  overflow: hidden;
  padding: 6px 0;
  z-index: 99999;
}
#group-scroll {
  display: inline-block;
  padding-left: 300%;
  animation: gscroll 2400s linear infinite;
}
@keyframes gscroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* ===== Four Office Ticker ===== */
#fouroffice-ticker {
  position: fixed;
  bottom: 32px;
  width: 100%;
  background: #111;
  color: #ffeb3b;
  font-size: 20px;
  white-space: nowrap;
  overflow: hidden;
  padding: 5px 0;
  z-index: 100000;
}
#fouroffice-scroll {
  display: inline-block;
  padding-left: 300%;
  animation: fourScroll 100s linear infinite;
}
@keyframes fourScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
</style>

</head>
<body>

<!-- ============================= -->
<!-- LIVE BULLETIN BAR -->
<!-- ============================= -->
<div id="live-bar">
  <div id="live-bar-scroll">
    <span id="live-bar-text">Loading latest NCCWC update…</span>
  </div>
</div>

<!-- ============================= -->
<!-- ⭐ ADDED: WALT MODEL TICKER ⭐ -->
<!-- ============================= -->
<div id="walt-ticker">
  <div id="walt-ticker-label">WALT</div>
  <div id="walt-ticker-window">
    <div id="walt-ticker-scroll">Loading WALT Model…</div>
  </div>
</div>

<!-- ============================= -->
<!-- GROUPED NWS OFFICE TICKER -->
<!-- ============================= -->
<div id="group-ticker">
  <div id="group-scroll">Loading NWS office advisories…</div>
</div>

<!-- ============================= -->
<!-- FOUR-OFFICE TICKER -->
<!-- ============================= -->
<div id="fouroffice-ticker">
  <div id="fouroffice-scroll">Loading Oklahoma–Arkansas office warnings…</div>
</div>

<!-- ===================================================== -->
<!-- PAGE CONTENT (unchanged) -->
<!-- ===================================================== -->

<div class="wrap">
  <header class="header">
    <div class="logo">📻</div>
    <div class="title-group">
      <h1>NCCWC Radio</h1>
      <p class="tagline">Original songs + live severe weather context.</p>
    </div>
    <div class="on-air-dot">
      <span></span><div>Always On</div>
    </div>
  </header>

  <!-- your radio player + playlist (unchanged) -->
</div>

<!-- ===================================================== -->
<!-- JAVASCRIPT SECTION -->
<!-- ===================================================== -->

<script>
/* LIVE BULLETIN TXT */
async function loadLiveBulletin() {
  const barTextEl = document.getElementById('live-bar-text');
  try {
    const res = await fetch('bulletin.txt?_=' + Date.now());
    const text = (await res.text()).trim();
    barTextEl.textContent = text || "NCCWC: No active bulletin.";
  } catch {
    barTextEl.textContent = "NCCWC: Error loading bulletin.";
  }
}
loadLiveBulletin();
setInterval(loadLiveBulletin, 20000);

/* ⭐ WALT MODEL TXT ⭐ */
async function loadWaltTicker() {
  const el = document.getElementById("walt-ticker-scroll");
  try {
    const res = await fetch("walt.txt?_=" + Date.now());
    const text = (await res.text()).trim();
    el.textContent = text || "WALT Model: No active alert.";
  } catch {
    el.textContent = "WALT Model: Error loading file.";
  }
}
loadWaltTicker();
setInterval(loadWaltTicker, 20000);

/* Grouped NWS ticker */
async function loadGroupedNWS() {
  try {
    const res = await fetch("https://api.weather.gov/alerts/active");
    const data = await res.json();
    if (!data.features.length) {
      document.getElementById("group-scroll").textContent =
      "No active NWS alerts nationwide.";
      return;
    }
    const out = data.features.slice(0,10).map(f => f.properties.event).join(" • ");
    document.getElementById("group-scroll").textContent = out;
  } catch {
    document.getElementById("group-scroll").textContent =
    "Error loading advisory feed.";
  }
}
loadGroupedNWS();
setInterval(loadGroupedNWS, 60000);

/* Four office ticker */
async function loadFourOfficeNWS() {
  try {
    const res = await fetch("https://api.weather.gov/alerts/active");
    const data = await res.json();

    const TARGET = [
      "NWS Tulsa OK",
      "NWS Norman OK",
      "NWS Little Rock AR",
      "NWS Shreveport LA"
    ];

    const alerts = data.features.filter(
      f => TARGET.includes(f.properties.senderName)
    );

    if (!alerts.length) {
      document.getElementById("fouroffice-scroll").textContent =
      "No severe weather in Tulsa, Norman, Little Rock, or Shreveport.";
      return;
    }

    const out = alerts
      .map(f => f.properties.senderName + ": " + f.properties.event)
      .join("  |  ");

    document.getElementById("fouroffice-scroll").textContent = out;

  } catch {
    document.getElementById("fouroffice-scroll").textContent =
    "Error loading office warnings.";
  }
}
loadFourOfficeNWS();
setInterval(loadFourOfficeNWS, 60000);
</script>

</body>
