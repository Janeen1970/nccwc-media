<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>NCCWC Media</title>

<style>
:root { --danger:#b91c1c; }

body{
  margin:0;
  padding-top:340px;
  background:#020617;
  color:#f9fafb;
  font-family:Arial;
}

/* ===== CORE ANIMATION ===== */
@keyframes tickerMove{
  from { transform: translateX(100vw); }
  to   { transform: translateX(-100%); }
}

/* ===== MOVING ELEMENT ===== */
.mover{
  white-space:nowrap;
  display:inline-block;

  animation-name:tickerMove;
  animation-timing-function:linear;
  animation-iteration-count:infinite;

  animation-duration: var(--speed, 40s);
}

/* ===== BULLETIN ===== */
#live-bar{
  position:fixed; top:0; left:0; right:0;
  height:56px; background:var(--danger);
  display:flex; align-items:center;
  overflow:hidden; z-index:9999;
}

/* ===== WALT ===== */
#walt-ticker{
  position:fixed; top:56px; left:0; right:0;
  height:40px; background:black; color:#0f0;
  display:flex; align-items:center;
  overflow:hidden; z-index:9998;
}
#walt-ticker-label{ padding:0 10px; font-weight:bold; }
#walt-ticker-window{ flex:1; overflow:hidden; }

/* ===== GENERIC TICKERS ===== */
.ticker{
  position:fixed; left:0; right:0;
  height:36px;
  display:flex; align-items:center;
  overflow:hidden; z-index:9997;
}

.ticker .label{
  padding:0 10px;
  min-width:90px;
  font-weight:bold;
}

.ticker .scroll{
  flex:1;
  overflow:hidden;
}
/* STACK */
.watch{top:96px;background:#111;color:#facc15;}
.warning{top:132px;background:#3f0000;color:#ff4d4d;}
.report{top:168px;background:#001f3f;color:#66ccff;}
.radar{top:204px;background:#111827;color:#c084fc;}
.hackett{top:240px;background:#111827;color:#22c55e;}
.world{top:276px;background:#111827;color:#44ccff;}

/* ===== RADIO ===== */
.wrap{max-width:1100px;margin:auto;padding:20px;}
.grid{display:flex;gap:16px;}
section.card{width:65%;}
aside.card{width:35%;}

.track{
  padding:6px;
  border-bottom:1px solid #222;
  cursor:pointer;
}
.track.badge-playing{ background:#222; }
</style>
</head>

<body>

<!-- BULLETIN -->
<div id="live-bar">
  <div id="live-bar-text" class="mover"></div>
</div>

<!-- WALT -->
<div id="walt-ticker">
  <div id="walt-ticker-label">WALT</div>
  <div id="walt-ticker-window">
    <div id="walt-text" class="mover"></div>
  </div>
</div>

<!-- WATCH -->
<div class="ticker watch">
  <div class="label">WATCH</div>
  <div class="scroll">
    <div id="watch-text" class="mover"></div>
  </div>
</div>

<!-- WARNING -->
<div class="ticker warning">
  <div class="label">WARNING</div>
  <div class="scroll">
    <div id="warning-text" class="mover"></div>
  </div>
</div>

<!-- REPORT -->
<div class="ticker report">
  <div class="label">REPORTS</div>
  <div class="scroll">
    <div id="report-text" class="mover"></div>
  </div>
</div>

<!-- RADAR -->
<div class="ticker radar">
  <div class="label">RADAR</div>
  <div class="scroll">
    <div id="radar-text" class="mover"></div>
  </div>
</div>

<!-- HACKETT -->
<div class="ticker hackett">
  <div class="label">HACKETT</div>
  <div class="scroll">
    <div id="hackett-text" class="mover"></div>
  </div>
</div>

<!-- WORLD -->
<div class="ticker world">
  <div class="label">WORLD</div>
  <div class="scroll">
    <div id="world-text" class="mover"></div>
  </div>
</div>

<div class="wrap">
<div class="grid">

<section class="card">
<h2>Now Playing</h2>
<h3 id="now-title">—</h3>

<audio id="audio" controls></audio>

<div style="
background:#111827;
padding:12px;
margin:15px 0;
border-left:4px solid #66ccff;
border-radius:6px;
">
<b>NCCWC Products</b><br><br>

<div>
  <a href="https://www.lulu.com/shop/wayne-adams/flood-risk-and-the-need-for-operational-risk-assessment-frameworks/paperback/product-w4gvvnr.html?q=Flood+Wayne+Adams&page=1&pageSize=4"
   target="_blank"
   style="color:#66ccff;text-decoration:none;font-size:16px;">
Flood Risk and the Need for Operational Risk Assessment Frameworks</a> </div>

<div>

<a href="https://payhip.com/b/N6Hs5"
   target="_blank"
   style="color:#66ccff;text-decoration:none;font-size:16px;">
WALT STORM SENTINEL
</a>
</div>

<div>
  <a href="https://sites.google.com/view/nccwc/nccwc-weather-and-climate-radio"
   target="_blank"
   style="color:#66ccff;text-decoration:none;font-size:16px;">
NATIONAL CLIMATE CHANGE WARNING CENTER WEATHER AND CLIMATE RADIO</a> </div>

<div>

<div>
<button id="btn-prev">Prev</button>
<button id="btn-play">Play</button>
<button id="btn-next">Next</button>
</div>

<div id="status"></div>
</section>

<aside class="card">
<h2>Playlist</h2>
<ul id="playlist"></ul>
</aside>

</div>
</div>

<script>

/* ===== FIXED PER-TICKER SPEEDS ===== */
function loadTicker(file,id,fallback){
  fetch(file+"?_="+Date.now())
    .then(r=>r.text())
    .then(t=>{
      const text = t.trim() || fallback;
      const el = document.getElementById(id);

      el.textContent = text + "   •   ";

      /* 🔥 MANUAL SPEED CONTROL (OPTION 2) */
      if(id === "warning-text") el.style.setProperty("--speed","700s");
      else if(id === "watch-text") el.style.setProperty("--speed","400s");
      else if(id === "report-text") el.style.setProperty("--speed","120s");
      else if(id === "radar-text") el.style.setProperty("--speed","120s");
      else if(id === "walt-text") el.style.setProperty("--speed","120s");
      else if(id === "live-bar-text") el.style.setProperty("--speed","120s");
      else if(id === "hackett-text") el.style.setProperty("--speed","120s");
      else if(id === "world-text") el.style.setProperty("--speed","120s");
    })
    .catch(()=>{
      document.getElementById(id).textContent = fallback;
    });
}

function loadAllTickers(){
  loadTicker("bulletin.txt","live-bar-text","No bulletin.");
  loadTicker("walt.txt","walt-text","No WALT.");
  loadTicker("watch.txt","watch-text","No watches.");
  loadTicker("warning.txt","warning-text","No warnings.");
  loadTicker("reports.txt","report-text","No reports.");
  loadTicker("radar.txt","radar-text","Radar quiet.");
  loadTicker("hackett.txt","hackett-text","No Hackett data.");
  loadTicker("world.txt","world-text","No World data.");
}

loadAllTickers();
setInterval(loadAllTickers,5000);

/* ===== RADIO (UNCHANGED) ===== */
const GH_OWNER="Janeen1970";
const GH_REPO="nccwc-media";
const API_URL=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/`;

const audio=document.getElementById("audio");
const playlist=document.getElementById("playlist");
const now=document.getElementById("now-title");

let tracks=[];
let index=0;

function loadTrack(i, autoplay=false){
  index=(i+tracks.length)%tracks.length;
  audio.src=tracks[index].url;
  now.textContent=tracks[index].title;

  if(autoplay){
    audio.play().catch(()=>{
      document.getElementById("status").textContent="Click Play to start audio.";
    });
  }
}

function next(){loadTrack(index+1,true);}
function prev(){loadTrack(index-1,true);}

document.getElementById("btn-next").onclick=next;
document.getElementById("btn-prev").onclick=prev;

document.getElementById("btn-play").onclick=()=>{
  if(audio.paused){audio.play();}
  else{audio.pause();}
};

audio.addEventListener("ended", next);

async function loadTracks(){
  const res=await fetch(API_URL);
  const data=await res.json();

  tracks=data
    .filter(x=>x.name.endsWith(".mp3"))
    .map(x=>({
      title:x.name.replace(".mp3",""),
      url:x.download_url
    }));

  playlist.innerHTML="";
  tracks.forEach((t,i)=>{
    const li=document.createElement("li");
    li.className="track";
    li.textContent=t.title;
    li.onclick=()=>loadTrack(i,true);
    playlist.appendChild(li);
  });

  loadTrack(0);
}

loadTracks();

</script>

</body>
</html>
